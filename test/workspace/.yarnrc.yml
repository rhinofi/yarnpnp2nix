approvedGitRepositories:
  - "**"

compressionLevel: 0

enableGlobalCache: true

enableScripts: true

npmMinimalAgeGate: 0

packageExtensions:
  styled-components@*:
    dependencies:
      react-is: "*"
  subscriptions-transport-ws@*:
    peerDependenciesMeta:
      "@types/ws":
        optional: true
